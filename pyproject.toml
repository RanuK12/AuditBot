[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditbot"
version = "1.0.0"
description = "API + Bot de auditoría de accesibilidad web (WCAG 2.1 AA)"
authors = [
    {name = "Emilio Ranucoli", email = "emilio@ranuk.dev"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Accessibility",
]

[project.urls]
Homepage = "https://github.com/RanuK12/auditbot"
Documentation = "https://github.com/RanuK12/auditbot#readme"
Repository = "https://github.com/RanuK12/auditbot"
Issues = "https://github.com/RanuK12/auditbot/issues"

[tool.setuptools]
packages = ["auditbot"]
python-source = ["auditbot"]

[tool.setuptools.packages.find]
where = [""]

[project.scripts]
auditbot = "auditbot.app:main"

[tool.pytest.ini_options]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v --tb=short"
testpaths = ["test_app.py", "test_bot.py"]

[tool.coverage.run]
source = ["auditbot"]
omit = ["*/test_*.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.",
]
